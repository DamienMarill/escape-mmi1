<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="La salle vue de dessus — dix postes s'allument">
  <!-- Plan de la salle : 10 postes qui s'allument un par un (animation interne,
       boucle lente). Sans animation (prefers-reduced-motion), tous restent allumés. -->
  <style>
    .mur { stroke: #dfe3f0; stroke-width: 5; fill: none; }
    .proj { fill: #8a93ad; }
    .poste { fill: #4f8fcc; animation: allume 12s infinite; }
    @keyframes allume {
      0% { fill-opacity: 0.15; }
      6% { fill-opacity: 1; }
      88% { fill-opacity: 1; }
      96%, 100% { fill-opacity: 0.15; }
    }
    .poste:nth-of-type(1) { animation-delay: 0.0s; }
    .poste:nth-of-type(2) { animation-delay: 0.5s; }
    .poste:nth-of-type(3) { animation-delay: 1.0s; }
    .poste:nth-of-type(4) { animation-delay: 1.5s; }
    .poste:nth-of-type(5) { animation-delay: 2.0s; }
    .poste:nth-of-type(6) { animation-delay: 2.5s; }
    .poste:nth-of-type(7) { animation-delay: 3.0s; }
    .poste:nth-of-type(8) { animation-delay: 3.5s; }
    .poste:nth-of-type(9) { animation-delay: 4.0s; }
    .poste:nth-of-type(10) { animation-delay: 4.5s; }
    @media (prefers-reduced-motion: reduce) { .poste { animation: none; } }
  </style>
  <rect class="mur" x="20" y="20" width="160" height="160" rx="6" />
  <!-- Le vidéoprojecteur, au mur du haut -->
  <rect class="proj" x="84" y="26" width="32" height="12" rx="3" />
  <!-- Dix postes le long des murs -->
  <g>
    <rect class="poste" x="34" y="52" width="22" height="22" rx="4" />
    <rect class="poste" x="34" y="88" width="22" height="22" rx="4" />
    <rect class="poste" x="34" y="124" width="22" height="22" rx="4" />
    <rect class="poste" x="66" y="148" width="22" height="22" rx="4" />
    <rect class="poste" x="102" y="148" width="22" height="22" rx="4" />
    <rect class="poste" x="138" y="148" width="22" height="22" rx="4" />
    <rect class="poste" x="144" y="112" width="22" height="22" rx="4" />
    <rect class="poste" x="144" y="76" width="22" height="22" rx="4" />
    <rect class="poste" x="144" y="40" width="22" height="22" rx="4" />
    <rect class="poste" x="90" y="94" width="22" height="22" rx="4" />
  </g>
</svg>
