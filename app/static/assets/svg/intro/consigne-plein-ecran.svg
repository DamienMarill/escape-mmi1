<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rester en affichage plein écran">
  <!-- ✓ Les postes restent en plein écran, on ne change pas de page. -->
  <style>
    .trait { stroke: #dfe3f0; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ok { stroke: #45c98b; }
  </style>
  <!-- Écran -->
  <rect class="trait" x="34" y="46" width="132" height="92" rx="8" />
  <line class="trait" x1="82" y1="158" x2="118" y2="158" />
  <line class="trait" x1="100" y1="138" x2="100" y2="158" />
  <!-- Fenêtre maximisée : flèches vers les coins -->
  <g class="trait" stroke-width="5">
    <path d="M 56 80 L 56 62 L 74 62" />
    <path d="M 144 62 L 144 80 M 144 62 L 126 62" />
    <path d="M 56 104 L 56 122 L 74 122" />
    <path d="M 144 122 L 126 122 M 144 122 L 144 104" />
  </g>
  <!-- Badge ✓ -->
  <circle class="trait ok" cx="158" cy="42" r="24" fill="#0e1420" />
  <path class="trait ok" d="M 146 42 L 155 51 L 171 33" />
</svg>
