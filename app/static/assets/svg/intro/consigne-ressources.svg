<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Les documents de la salle sont à votre disposition">
  <!-- ✓ Ressources de la salle : certains documents ne sont pas numérisés. -->
  <style>
    .trait { stroke: #dfe3f0; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ok { stroke: #45c98b; }
  </style>
  <!-- Livre ouvert -->
  <path class="trait" d="M 100 60 C 82 48 58 46 40 50 V 138 C 58 134 82 136 100 148 C 118 136 142 134 160 138 V 50 C 142 46 118 48 100 60 Z" />
  <line class="trait" x1="100" y1="60" x2="100" y2="148" />
  <!-- Lignes de texte -->
  <g class="trait" stroke-width="4" opacity="0.7">
    <line x1="54" y1="72" x2="86" y2="66" />
    <line x1="54" y1="88" x2="86" y2="82" />
    <line x1="114" y1="66" x2="146" y2="72" />
    <line x1="114" y1="82" x2="146" y2="88" />
  </g>
  <!-- Badge ✓ -->
  <circle class="trait ok" cx="158" cy="42" r="24" fill="#0e1420" />
  <path class="trait ok" d="M 146 42 L 155 51 L 171 33" />
</svg>
